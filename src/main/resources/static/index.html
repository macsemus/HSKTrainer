<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSK Trainer</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1, h2 {
            text-align: center;
            color: #2c3e50;
        }
        .hsk-section {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .hsk-title {
            font-size: 1.25rem;
            font-weight: bold;
            color: #34495e;
            margin-bottom: 15px;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 8px;
        }
        .blocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
        }
        .block-card {
            background: #3498db;
            color: white;
            padding: 12px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            font-weight: 500;
        }
        .block-card:hover {
            background: #2980b9;
            transform: translateY(-2px);
        }
        /* Стили для экрана теста */
        #test-screen {
            display: none;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
        }
        .chinese-char {
            font-size: 5rem;
            margin: 10px 0;
            color: #2c3e50;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        .option-btn {
            background: #ecf0f1;
            border: none;
            padding: 15px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .option-btn:hover {
            background: #bdc3c7;
        }
        .option-btn.correct {
            background-color: #2ecc71 !important;
            color: white;
        }
        .option-btn.wrong {
            background-color: #e74c3c !important;
            color: white;
        }
        /* Блок с деталями/примером после ответа */
        #feedback-container {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            text-align: left;
            border-left: 5px solid #3498db;
        }
        #answer-status {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .next-btn, .back-btn {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 20px;
            font-size: 1rem;
        }
        .back-btn {
            background: #95a5a6;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Изучение HSK</h1>

    <!-- Главное меню -->
    <div id="menu-screen">
        <div id="app"></div>
    </div>

    <!-- Экран теста -->
    <div id="test-screen">
        <h2 id="test-title">Тест</h2>
        <div id="progress">Вопрос 1 / 50</div>
        <div class="chinese-char" id="char-display">字</div>

        <div class="options-grid" id="options-container">
            <!-- Кнопки выбора -->
        </div>

        <!-- Карточка с разбором после ответа -->
        <div id="feedback-container">
            <div id="answer-status"></div>
            <p><strong>Пиньинь:</strong> <span id="info-pinyin"></span></p>
            <p><strong>Описание:</strong> <span id="info-desc"></span></p>
            <p><strong>Пример:</strong> <span id="info-example"></span></p>
            <button class="next-btn" onclick="nextQuestion()">Следующий вопрос</button>
        </div>

        <br>
        <button class="back-btn" onclick="returnToMenu()">К списку блоков</button>
    </div>
</div>

<script>
    // Указываем стартовые ID для каждого уровня, чтобы диапазоны не сбрасывались
    const hskStructure = [
        { level: 1, startId: 1, totalWords: 150, wordsPerBlock: 50 },
        { level: 2, startId: 151, totalWords: 150, wordsPerBlock: 50 },
        { level: 3, startId: 301, totalWords: 300, wordsPerBlock: 50 }
    ];

    const appDiv = document.getElementById('app');
    const menuScreen = document.getElementById('menu-screen');
    const testScreen = document.getElementById('test-screen');

    let currentBlockWords = [];
    let currentIndex = 0;
    let score = 0;
    let currentBlockNumber = 1;

    function renderMenu() {
        appDiv.innerHTML = '';
        hskStructure.forEach(hsk => {
            const section = document.createElement('div');
            section.className = 'hsk-section';

            const title = document.createElement('div');
            title.className = 'hsk-title';
            title.textContent = `HSK Уровень ${hsk.level}`;
            section.appendChild(title);

            const grid = document.createElement('div');
            grid.className = 'blocks-grid';

            const totalBlocks = Math.ceil(hsk.totalWords / hsk.wordsPerBlock);

            for (let i = 1; i <= totalBlocks; i++) {
                const start = hsk.startId + (i - 1) * hsk.wordsPerBlock;
                let end = hsk.startId + i * hsk.wordsPerBlock - 1;
                const maxEnd = hsk.startId + hsk.totalWords - 1;
                if (end > maxEnd) {
                    end = maxEnd;
                }

                const card = document.createElement('div');
                card.className = 'block-card';
                card.innerHTML = `Блок ${i}<br><small>${start} - ${end}</small>`;
                card.onclick = () => startTest(start, end, i);

                grid.appendChild(card);
            }

            section.appendChild(grid);
            appDiv.appendChild(section);
        });
    }

    async function startTest(startId, endId, blockNum) {
        currentBlockNumber = blockNum;
        try {
            const response = await fetch(`http://localhost:8080/api/zi/test?firstId=${startId}&endId=${endId}`);
            if (!response.ok) throw new Error('Ошибка загрузки');

            currentBlockWords = await response.json();
            if (currentBlockWords.length === 0) {
                alert('В этом блоке нет слов!');
                return;
            }

            // Перемещение (рандом) убрано — порядок строго по ID из базы данных
            currentIndex = 0;
            score = 0;

            menuScreen.style.display = 'none';
            testScreen.style.display = 'block';

            loadQuestion();
        } catch (error) {
            console.error(error);
            alert('Ошибка подключения к бэкенду.');
        }
    }

    function loadQuestion() {
        if (currentIndex >= currentBlockWords.length) {
            finishTest();
            return;
        }

        // Скрываем блок ответа, показываем варианты
        document.getElementById('feedback-container').style.display = 'none';
        document.getElementById('options-container').style.display = 'grid';

        document.getElementById('progress').textContent = `Вопрос ${currentIndex + 1} / ${currentBlockWords.length}`;

        const currentWord = currentBlockWords[currentIndex];
        document.getElementById('char-display').textContent = currentWord.zi;

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        // Генерация вариантов перевода
        let incorrectOptions = currentBlockWords
            .filter(w => w.id !== currentWord.id)
            .sort(() => Math.random() - 0.5)
            .slice(0, 3)
            .map(w => w.translation);

        let options = [...incorrectOptions, currentWord.translation].sort(() => Math.random() - 0.5);

        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = opt;
            btn.onclick = () => checkAnswer(opt, currentWord, btn);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedOpt, currentWord, clickedButton) {
        const isCorrect = (selectedOpt === currentWord.translation);

        if (isCorrect) {
            score++;
            clickedButton.classList.add('correct');
        } else {
            clickedButton.classList.add('wrong');
            // Подсвечиваем правильный ответ зеленым
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => {
                if (btn.textContent === currentWord.translation) {
                    btn.classList.add('correct');
                }
            });
        }

        const statusEl = document.getElementById('answer-status');
        if (isCorrect) {
            statusEl.textContent = '✅ Верно!';
            statusEl.style.color = '#2ecc71';
        } else {
            statusEl.textContent = '❌ Ошибка!';
            statusEl.style.color = '#e74c3c';
        }

        // Скрываем кнопки выбора, показываем карточку с разбором
        document.getElementById('options-container').style.display = 'none';

        document.getElementById('info-pinyin').textContent = currentWord.pinyin || 'нет данных';
        document.getElementById('info-desc').textContent = currentWord.description || 'нет описания';
        document.getElementById('info-example').textContent = currentWord.example || 'нет примера';

        document.getElementById('feedback-container').style.display = 'block';
    }

    function nextQuestion() {
        currentIndex++;
        loadQuestion();
    }

    async function finishTest() {
        testScreen.innerHTML = `
            <h2>Тест завершен!</h2>
            <p style="font-size: 1.5rem;">Правильных ответов: ${score} из ${currentBlockWords.length}</p>
            <button class="back-btn" onclick="returnToMenu()">В главное меню</button>
        `;

        try {
            await fetch(`http://localhost:8080/api/tests?blockNumber=${currentBlockNumber}&score=${score}&questionsNumber=${currentBlockWords.length}`, {
                method: 'POST'
            });
        } catch (e) {
            console.error('Не удалось сохранить результат', e);
        }
    }

    function returnToMenu() {
        testScreen.style.display = 'none';
        menuScreen.style.display = 'block';
        location.reload();
    }

    renderMenu();
</script>

</body>
</html>
